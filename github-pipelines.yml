# Production must match the environment name in Bitbucket repository settings.
# This YAML does NOT enable JSM tracking or gating; configure both separately.
image: alpine:3.22

pipelines:
  branches:
    main:
      - step:
          name: Check and package website
          script:
            - grep -qi '<!doctype html>' index.html
            - grep -q 'id="announcement"' index.html
            - grep -qi '</html>' index.html
            - mkdir -p dist
            - cp index.html dist/index.html
            - echo "Basic page checks passed - not a full HTML validator."
          artifacts:
            - dist/**
      - step:
          name: Production deployment - SIMULATED
          deployment: Production
          script:
            - test -s dist/index.html
            - echo "SIMULATED DEPLOYMENT - no website published."
